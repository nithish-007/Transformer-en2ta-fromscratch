# Model Configuration
d_model: 512
n_layers: 6
n_heads: 8
d_ff: 2048
dropout: 0.1

# Training Configuration
batch_size: 16
num_epochs: 20
learning_rate: 0.0001

# Data Configuration
dataset_name: "jarvisvasu/english-to-colloquial-tamil"
seq_len: 512
tokenizer_type: "BPE"  # BPE or word_level

# Tokenizer Paths
src_tokenizer_path: "token_files/tokenizer_en.json"
tgt_tokenizer_path: "token_files/tokenizer_ta.json"

# Decoding Configuration
beam_size: 5

# Early Stopping
early_stopping_patience: 5
early_stopping_min_delta: 0.001

# Paths
checkpoint_dir: "checkpoints"
log_dir: "logs"

# Dataset Columns
# Dataset has: instruction, input, output
# - input: English sentences
# - output: Tamil translations
# - instruction: Task description (not used in training)
